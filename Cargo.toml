[package]
name = "gpu-grep"
version = "0.1.0"
edition = "2021"

[dependencies]
# The WebGPU implementation
wgpu = "30.0.1"

# Zero-copy memory mapped files
memmap2 = "0.9.12"

# Command line argument parsing
clap = { version = "4.6.7", features = ["derive"] }

# Safely casting data to/from raw bytes for the GPU
bytemuck = { version = "1.22.0", features = ["derive"] }

# Blocking executor to run the async WebGPU setup in our synchronous CLI
pollster = "0.4.0"

# Logging for debugging WebGPU errors
log = "0.4"
env_logger = "0.11"